<!DOCTYPE html>
<html>
<head>
    <title>login animado</title>
    <meta charset="UTF-8">
    <style>
        *{
            margin:0;
            padding: 0;
            box-sizing: border-box;
            font-family:"Times New Roman";
        }
        body{
            display:flex ;
            justify-content:center ;
            align-items:center;
            min-height:100vh;
            background:#25252b;
        }
        @property --a{
            syntax:'<angle>';
            inherits:false;
            initial-value:0deg;
        }
        .box{
            position:relative;
            width:400px;
            height:200px;
            background:repeating-conic-gradient(from var(--a),#f7ad24 0%,
            #f7ad24 5%, transparent 5%,transparent 40%, #f7ad24 50%);
            filter:drop-shadow(0 15px 50px #000);
            border-radius:20px;
            animation: rotating 4s linear infinite;
            display:flex;
            justify-content:center;
            align-items:center;
            transition:0.5s;
        }
        .box:hover{
            width:400px;
            height:500px;
        }
        @keyframes rotating{
            0%{
                --a: 0deg
            }
            100%{
                --a: 360deg
            }
        }
        .box::before{
            content:'';
            position:absolute;
            width:100%;
            height:100%;
            background:repeating-conic-gradient(from var(--a),#246ef7 0%,
            #246ef7 5%, transparent 5%,transparent 40%, #246ef7 50%);
            filter:drop-shadow(0 15px 50px #000);
            border-radius:20px;
            animation: rotating 4s linear infinite;
            animation-delay: -1s;
        }
        .box::after{
            content:'';
            position:absolute;
            inset:4px;
            background:#2d2d39;
            border-radius:15px;
            border:8px solid #25252b;
        }
        .login{
            position:absolute;
            inset:60px;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            border-radius:10px;
            background:rgba(0,0,0,0.2);
            z-index:1000;
            box-shadow:inset 0 10px 20px rgba(0,0,0,0.5);
            border-bottom:2px solid rgba(255 255,255,0.5);
            transition:0.5s;
            color:white;
            overflow:hidden;
        }
        .box:hover .login{
            inset:40px;
        }
        .loginBx{
            position:relative;
            display:flex;
            justify-content:center;
            align-items:center ;
            flex-direction:column ;
            gap:20px;
            width:70%;
            transition:0.5s;
            transform:translateY(130px);
        }
        .box:hover .loginBx{
            transform:translateY(0);
        }
        .loginBx h2{
            text-transform:uppercase;
            font-weight:600;
            letter-spacing: 0.2em;
        }
        .loginBx h2 i{
            color:#f7ad24;
            text-shadow: 0 0 5px #f7ad24, 0 0 25px #f7ad24;
        }
        .loginBx input{
            width:100%;
            padding:10px 20px;
            outline:none;
            border:none;
            font-size:1em;
            color:#fff;
            background:rgba(0,0,0,0.1);
            border-radius:30px;
            border:2px solid #fff;
        }
        .loginBx input::placeholder{
            color:#999;
        }
        .loginBx input[type="submit"]{
            background:#24d7f7;
            border:none;
            font-weight:500;
            color:#111;
            cursor:pointer;
            transition:0.5s;
        }
        .loginBx input[type="submit"]:hover{
            box-shadow:0 0 10px #24d7f7, 0 0 60px #24d7f7;
        }
        .group{
            width:100%;
            display:flex ;
            justify-content:space-between;
        }
        .group a{
            color:#fff;
            text-decoration:none;
        }
        .group a:nth-child(2){
            color:#f7ad24;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="login">
            <div class ="loginBx">
                <h2><i class"iLogin">🏡</i>login<i class="2login">🚪</i></h2>
                <input type="text" placeholder="username">
                <input type="password" placeholder="password">
                <input type="submit" value="Sign in">
                <div class="group">
                    <a href="#">Olvidé la contraseña</a>
                    <a href="#">Sign up</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
