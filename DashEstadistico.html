<!DOCTYPE html>
<html>
<head>
    <title>cuadros Estadísticos</title>
    <meta charset="UTF-8">
    <style>
        *{
            margin:0;
            padding: 0;
            box-sizing: border-box;
            font-family:"Times New Roman";
        }
        :root{
            --blue:#287bff;
            --white:#fff;
            --grey:#f5f5f5;
            --black1:#222;
            --black2:#999;
        }
        body{
            min-height:100vh;
            overflow-x:hidden;
        }
       .container{
           position:relative;
           width:100%;
       }
       .navigation{
           position:fixed;
           width:300px;
           height:100%;
           background:var(--blue);
           border-left: 10px solid var(--blue);
           transition:0.5s;
           overflow:hidden;
       }
       .navigation ul{
           position:absolute;
           top:0;
           left:0;
           width:100%;
       }
       .navigation ul li{
           position:relative;
           width:100%;
           list-style:none;
           border-top-left-radius: 40px;
           border-bottom-left-radius: 40px;
       }
       .navigation ul li:hover{
           background: var(--white);
       }
       .navigation ul li:nth-child(1){
          margin-bottom:40px;
          pointer-events:none;
       }
       .navigation ul li a{
           position:relative ;
           display:block;
           width:100%;
           display:flex;
           text-decoration:none ;
           color:var(--white);
       }
       .navigation ul li:hover a{
           color:var(--blue);
       }
       .navigation ul li a .icon{
           position:relative;
           display:block;
           min-width: 60px;
           height:70px;
           line-height:60px;
           align-items:center;
       }
       .navigation ul li a .icon i{
           font-size:1em;
       }
       .navigation ul li a .title{
           position:absolute ;
           display:block;
           padding:0 40px;
           height:60px;
           line-height:60px;
           text-align: start;
       }
       .navigation ul li:hover a::before{
           content:'';
           position:absolute ;
           right:0;
           top:-50px;
           width:50px;
           height:50px;
           background:transparent;
           border-radius:50%;
           box-shadow:35px 35px 0 10px var(--white);
           pointer-events:none
       }
       .navigation ul li:hover a::after{
           content:'';
           position:absolute ;
           right:0;
           bottom:-50px;
           width:50px;
           height:50px;
           background:transparent;
           border-radius:50%;
           box-shadow:35px -35px 0 10px var(--white);
           pointer-events: none;
       }
    </style>
</head>
<body>
    <div class="container">
        <div class="navigation">
            <ul>
                <li>
                    <a href="#">
                        <span class="icon"><i>🍏</i></span>
                        <span class="title">brand name</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span class="icon"><i>🏠</i></span>
                        <span class="title">dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span class="icon"><i>👥</i></span>
                        <span class="title">customer</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span class="icon"><i>📜</i></span>
                        <span class="title">message</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span class="icon"><i>❓️</i></span>
                        <span class="title">help</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span class="icon"><i>⚙️</i></span>
                        <span class="title">settings</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span class="icon"><i>🔓</i></span>
                        <span class="title">password</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span class="icon"><i>🚪</i></span>
                        <span class="title">sign out</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
