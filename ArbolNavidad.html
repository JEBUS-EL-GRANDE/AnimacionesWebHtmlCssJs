<!DOCTYPE html>
<html>
<head>
    <title>Árbol de navida</title>
    <meta charset="UTF-8">
    <style>
        *{
            margin:0;
            padding: 0;
            box-sizing: border-box;
            font-family:"Times New Roman";
        }
        body{
            display:flex ;
            justify-content:center ;
            align-items:center;
            min-height:100vh;
            background:#e8ffe8;
        }
        .tree{
            position:absolute;
            top:200px;
            width:300px;
            height:300px;
            transform-style: preserve-3d;
            transform:rotateX(-20deg) rotateY(30deg);
            animation:animate 7s linear infinite;
        }
        .tree::before{
            content:'⭐️';
            position:absolute ;
            font-size:5em;
            top:-100px;
            left:calc(50% - 45px);
        }
        @keyframes animate{
            0%{
                transform:rotateX(-20deg) rotateY(360deg);
            }
            100%{
                transform:rotateX(-20deg) rotateY(0deg);
            }
        }
        .tree div{
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            transform-style: preserve-3d;
            transform:translateY(calc(100px * var(--j)));
        }
        .tree div.top span{
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:linear-gradient(90deg,#69c069,#77dd77);
            clip-path:polygon(50% 0% ,0% 100%, 100% 100%);
            border-bottom:10px solid #00000019;
            transform:rotateY(calc(90deg * var(--i))) rotateX(30deg) translateZ(86px);
        }
        .tree div.bottom span{
            position:absolute;
            top:350px;
            left:calc(50% - 30px);
            width:60px;
            height:100%;
            background:linear-gradient(90deg,#bb4622,#df7214);
            transform:bottom;
            /*clip-path:polygon(50% 0% ,0% 100%, 100% 100%);*/
            border-bottom:10px solid #00000055;
            transform:rotateY(calc(90deg * var(--i))) translateZ(30px);
        }
        .shadow{
            position:absolute ;
            top:0;
            left:0;
            width:300px;
            height:300px;
            background:#0002;
            transform-style:preserve-3d;
            transform:rotateX(90deg) translateZ(-500px);
            filter:blur(20px);
        }
        .tree div.text span{
            position:absolute;
            top:500px;
            left:0;
            width:100%;
            height:100%;
            transform-origin:bottom;
            transform:rotateY(calc(90deg * var(--i))) translateZ(173px);
            display:flex;
            justify-content:center;
            align-items :center ;
            color:#ff4242;
            font-size:6em;
            text-transform:uppercase;
            line-height:1em;
            -webkit-text-stroke:3px white;
            font-weight:600;
            transform-style:preserve-3d;
        }
        .tree div.text span:nth-child(1){
            font-size:6em;
        }
        .tree div.text span::before{
            content:attr(data-text);
            position:absolute ;
            bottom:100px;
            transform-origin:bottom ;
            transform:rotateX(-90deg);
            -webkit-text-stroke:0px #fff;
            color:rgba(0,0,0,0.1);
            filter:blur(5px);
        }
    </style>
</head>
<body>
    <div class="tree">
        <div class="top" style="--j:0;">
            <span style="--i:0;"></span>
            <span style="--i:1;"></span>
            <span style="--i:2;"></span>
            <span style="--i:3;"></span>
        </div>
        <div class="top" style="--j:1;">
            <span style="--i:0;"></span>
            <span style="--i:1;"></span>
            <span style="--i:2;"></span>
            <span style="--i:3;"></span>
        </div>
        <div class="top" style="--j:2;">
            <span style="--i:0;"></span>
            <span style="--i:1;"></span>
            <span style="--i:2;"></span>
            <span style="--i:3;"></span>
        </div>
        <div class="top" style="--j:3;">
            <span style="--i:0;"></span>
            <span style="--i:1;"></span>
            <span style="--i:2;"></span>
            <span style="--i:3;"></span>
        </div>
        <div class="bottom">
            <span style="--i:0;"></span>
            <span style="--i:1;"></span>
            <span style="--i:2;"></span>
            <span style="--i:3;"></span>
        </div>
        <span class="shadow"></span>
        <div class="text">
            <span style="--i:0;" data-text="Feliz">Feliz</span>
            <span style="--i:1;" data-text="Año">Año</span>
            <span style="--i:2;" data-text="Nuevo">Nuevo</span>
            <span style="--i:3;" data-text="2027">2027</span>
        </div>
    </div>
</body>
</html>
