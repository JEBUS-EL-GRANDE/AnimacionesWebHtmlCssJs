<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <title>animación cohete despegue</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            background:#eaeef0;
        }
        .loader{
            position:relative;
            display:flex;
        }
        .loader span{
            position:relative;
            width :250px;
            height:250px;
            background:#eaeef0;
            border:6px solid #eaeef0;
            border-radius: 50%;
            box-shadow: -8px -8px 15px rgba(255,255,255,1),
            8px 8px 25px rgba(0,0,0,0.15);
            overflow:hidden;
        }
        .loader span::before{
            content:'';
            position:absolute;
            inset:0;
            border-radius: 50%;
            box-shadow:inset 10px 10px 20px rgba(0,0,0,0.5),
            inset -5px -5px 15px rgba(255,255,255,1);
        }
        .loader span::after{
            content:'';
            position:absolute ;
            inset:40px;
            background:#eaeef0;
            border:3px solid #eaeef0;
            Border-radius:50%;
            box-shadow: -8px -8px 25px rgba(255,255,255,1),
            8px 8px 25px rgba(0,0,0,0.25),
            inset 3px 3px 10px rgba(0,0,0,0.15),
            inset -1px -1px 15px rgba(255,255,255,1);
        }
        .loader span i{
            position:absolute ;
            inset:0;
            border-radius: 50%;
            filter:blur(5px);
            background: linear-gradient(beige,#42abff, pink,#ff4f8b,#ffeb3b);
            animation:animacion 1s linear infinite;
        }
        @keyframes animacion{
            0%{
                transform:rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="loader">
        <span><i></i></span>
    </div>
</body>
</html>
