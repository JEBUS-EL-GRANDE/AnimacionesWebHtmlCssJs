<!DOCTYPE html>
<html>
<head>
    <title>cuadrados Vayven</title>
    <meta charset="UTF-8">
    <style>
        *{
            margin:0;
            padding: 0;
            box-sizing: border-box;
            font-family:"Times New Roman";
        }
        body{
            display:flex ;
            justify-content:center ;
            align-items:center;
            min-height:100vh;
            background:#434750;
            overflow:hidden ;
        }
        .loader{
            position:relative;
            transform:skewY(15deg) translateX(50px) translateY(50px);
        }
        .loader span{
            position:absolute ;
            width:200px;
            height:40px;
            display:block;
            background:#3e3f46;
            transition:0.5s;
        }
        .loader span:hover{
            background:#33a3ee;
            transition:0s;
        }
        .loader span::before{
            
        }
    </style>
</head>
<body>
    <div class="loader">
        <span style="--i:10;"></span>
        <span style="--i:9;"></span>
        <span style="--i:8;"></span>
        <span style="--i:7;"></span>
        <span style="--i:6;"></span>
        <span style="--i:5;"></span>
        <span style="--i:4;"></span>
        <span style="--i:3;"></span>
        <span style="--i:2;"></span>
        <span style="--i:1;"></span>
    </div>
</body>
</html>
